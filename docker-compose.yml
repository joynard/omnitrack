# Local development / verification stack.
#
#   docker compose up --build
#   -> app: http://localhost:8080
#   -> db:  postgres on localhost:5433
#
# The image deliberately contains NO .env. Configuration is injected at run time
# from the host .env via env_file, so editing .env and recreating the container
# is enough — no rebuild, and platform secrets always win in production.

# WHY an anchor instead of repeating the block: the app and the Telegram poller
# must point at exactly the same database and environment. A YAML anchor is the
# only sharing mechanism available *within* one Compose file -- an `x-` extension
# block cannot be referenced from docker-compose.dev.yml -- and hand-copied
# environment is how the two silently drift onto different databases.
x-compose-environment: &compose-environment
    # These win over .env, so the container always talks to the compose
    # database regardless of what the host .env holds for local PHP use.
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: omnitrack
    DB_USERNAME: omnitrack
    DB_PASSWORD: secret
    DB_SSLMODE: prefer
    APP_ENV: local
    LOG_CHANNEL: stderr

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: omnitrack-engine:local
        container_name: omnitrack-app
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment: *compose-environment
        ports:
            # Loopback only, not 0.0.0.0. Docker publishes to every interface by
            # default, which put this app (and its /api/harness surface) on whatever
            # network the laptop joined. The harness routes are token-guarded, but a
            # dev stack has no reason to be reachable from a shared wifi. Widen this
            # back to "8080:8080" only if the board must be opened from another
            # device on the same LAN.
            - "127.0.0.1:8080:8080"
        volumes:
            # Persist injected Google credentials and application storage.
            - ./storage/app/google:/var/www/html/storage/app/google
            - app-storage:/var/www/html/storage/logs
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 40s

    # -------------------------------------------------------------------------
    # Telegram bot: long-polls Telegram so the workspace can be driven from a
    # phone. It reuses the image `app` already built, so adding or changing the
    # bot never costs a rebuild.
    #
    # WHY a Compose service and not a fourth Supervisor program: a new program
    # only exists after `docker compose build`, which is exactly the multi-minute
    # path this stack is arranged to avoid, and it cannot be restarted on its own.
    #
    # WHY restart: on-failure and NOT unless-stopped: with no
    # TELEGRAM_BOT_TOKEN the command deliberately exits 0, and `always` /
    # `unless-stopped` restart a container whatever its exit code -- which would
    # hot-loop forever. `on-failure` restarts a genuine crash (exit 1) and leaves
    # an intentional clean stop alone. Supervisord has the same semantics, which
    # is why `telegram:poll` returns 0 when it has no token.
    # -------------------------------------------------------------------------
    telegram:
        image: omnitrack-engine:local
        container_name: omnitrack-telegram
        restart: on-failure
        env_file:
            - path: .env
              required: false
        environment: *compose-environment
        # Migrations must have completed before the poller reads telegram_messages.
        depends_on:
            app:
                condition: service_healthy
        # No entrypoint: this container runs the poller directly, so it never
        # re-runs migrations or starts a second nginx/supervisord alongside app.
        command: ["php", "artisan", "telegram:poll"]
        # Unprivileged, so anything it writes into storage is owned by www-data
        # and stays readable by php-fpm in the app container.
        user: www-data

    db:
        image: postgres:17-alpine
        container_name: omnitrack-db
        restart: unless-stopped
        ports:
            # 5433 on the host to avoid clashing with a local Postgres install.
            # WHY loopback: this host port exists so a tool ON the host can reach
            # Postgres. Nothing else needs it -- the app connects over the compose
            # network -- so binding it to every interface only offered the LAN a
            # password-guarded database.
            - "127.0.0.1:5433:5432"
        environment:
            POSTGRES_DB: omnitrack
            POSTGRES_USER: omnitrack
            POSTGRES_PASSWORD: secret
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U omnitrack -d omnitrack"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    db-data:
    app-storage:

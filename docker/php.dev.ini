; Development-only PHP settings.
;
; Mounted at /usr/local/etc/php/conf.d/zz-dev.ini by docker-compose.dev.yml.
;
; WHY zz- and NOT 99-: PHP loads conf.d in ALPHABETICAL order, and the image's
; own file is 99-omnitrack.ini. "99-dev" sorts BEFORE "99-omnitrack" (d < o), so
; the production file loaded LAST and won -- which silently kept
; opcache.validate_timestamps=0 in the dev stack, so no PHP edit ever reached the
; running FPM workers without a container restart. zz- sorts after every other
; file in that directory, which is what this file always intended.
;
; The production values live in docker/php.ini and stay untouched.

[opcache]
; The image sets opcache.validate_timestamps=0 and opcache.enable_cli=0.
; Both are correct for a frozen image and both actively break local editing:
; validate_timestamps=0 means PHP never notices that you saved a file, so you
; would still need a container restart after every edit -- defeating the point
; of the bind mount.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
; Re-check on every request rather than every N seconds. Costs one stat() per
; file; removes an entire class of "why is my change not showing up".
opcache.revalidate_freq=0

[PHP]
; Errors must be visible during development. The image sets display_errors=Off
; and routes everything to stderr for the platform log viewer; locally we want
; the stack trace in the HTTP response and on the CLI.
display_errors=On
display_startup_errors=On

; Laravel's own error handling is better than PHP's, but during development the
; extra notices are worth seeing.
error_reporting=E_ALL

; The image caps this at 256M, which is tight for the test suite and for
; `composer` operations. Raise it locally only.
memory_limit=512M

; Longer than production: Xdebug-less step debugging and slow first requests
; after a cache clear routinely exceed 60s.
max_execution_time=300

; Match the application timezone instead of UTC, so log timestamps and
; `now()` in tinker line up with what the app expects.
date.timezone=Asia/Jakarta

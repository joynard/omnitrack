[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --verbose
priority=30
autostart=true
autorestart=true
user=www-data
stopwaitsecs=3700
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; NOTE: the Telegram long-poll worker is deliberately NOT a program here.
;
; Locally it is the `telegram` service in docker-compose.yml, which reuses the
; already built omnitrack-engine:local image and therefore needs no rebuild --
; whereas a program in this file only takes effect after `docker compose build`.
; Having both would also mean two pollers on one bot token, and Telegram answers
; 409 Conflict to whichever long poll arrives second.
;
; If this image is ever deployed somewhere that does not run Compose (Koyeb),
; add it here -- mirroring queue-worker, with stopwaitsecs above the 25 s long
; poll and startsecs=0 so the clean "no token configured" exit is not reported
; as a startup failure:
;
;   [program:telegram-poll]
;   command=php /var/www/html/artisan telegram:poll
;   priority=40
;   autostart=true
;   autorestart=true
;   startsecs=0
;   user=www-data
;   stopwaitsecs=40
;   stdout_logfile=/dev/stdout
;   stdout_logfile_maxbytes=0
;   stderr_logfile=/dev/stderr
;   stderr_logfile_maxbytes=0
